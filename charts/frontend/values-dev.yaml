image:
  repository: 638325785916.dkr.ecr.us-east-1.amazonaws.com/tunefy-frontend-dev
  tag: "#{Octopus.Release.Number}"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-creds

replicaCount: 1  # Reduced to 1 due to memory constraints in dev cluster

service:
  type: NodePort
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:638325785916:certificate/f23f96ea-972e-4d98-8ed3-a20b21836380
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /
  hosts:
    - host: "app.dev.tunefy.site"
      paths:
        - path: /
          pathType: Prefix
    # Agregar regla para permitir acceso directo via ALB DNS
    - paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 150m
    memory: 192Mi
  requests:
    cpu: 50m
    memory: 96Mi

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 10
  failureThreshold: 3
