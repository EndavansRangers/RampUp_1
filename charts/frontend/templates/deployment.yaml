apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: tunefy-dev
  labels:
    app: {{ .Chart.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3  # Keep 3 ReplicaSets (more memory available with c7i-flex.large)
  strategy:
    type: RollingUpdate  # Back to RollingUpdate for zero-downtime deployments
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
      - name: frontend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if eq .Values.environment "dev" }}
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                # Fix DNS issue in dev - replace DNS name with ClusterIP
                # This is a workaround for CoreDNS timeouts in dev environment
                sleep 2
                BACKEND_IP="10.99.25.161"
                sed -i "s|backend\.tunefy-dev\.svc\.cluster\.local|$BACKEND_IP:3001|g" /etc/nginx/conf.d/default.conf
                sed -i "s|tunefy-backend-service\.default\.svc\.cluster\.local|$BACKEND_IP:3001|g" /etc/nginx/conf.d/default.conf
                nginx -s reload
        {{- end }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
