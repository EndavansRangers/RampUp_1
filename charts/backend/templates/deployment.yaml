{{- $colors := list "blue" "green" }}
{{- range $colors }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Chart.Name }}-{{ . }}
  namespace: tunefy-dev
  labels:
    app: {{ $.Chart.Name }}
    color: {{ . }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  replicas: {{ $.Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ $.Chart.Name }}
      color: {{ . }}
  template:
    metadata:
      labels:
        app: {{ $.Chart.Name }}
        color: {{ . }}
        {{- if eq . $.Values.color }}
        colorLive: "true"
        {{- else }}
        colorLive: "false"
        {{- end }}
    spec:
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
      - name: backend
        image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - containerPort: {{ $.Values.service.targetPort }}
          protocol: TCP
        env:
        {{- if $.Values.env }}
          {{- toYaml $.Values.env | nindent 10 }}
        {{- end }}
        {{- if $.Values.secrets.enabled }}
        # Database credentials from Secrets Manager via CSI
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.secretName }}
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.secretName }}
              key: password
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.secretName }}
              key: host
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.secretName }}
              key: dbname
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.secretName }}
              key: port
        {{- end }}
        {{- if $.Values.livenessProbe }}
        livenessProbe:
          {{- toYaml $.Values.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if $.Values.readinessProbe }}
        readinessProbe:
          {{- toYaml $.Values.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if $.Values.resources }}
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
        {{- end }}
        {{- if $.Values.secrets.enabled }}
        volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets
          readOnly: true
        {{- end }}
      {{- if $.Values.secrets.enabled }}
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ $.Values.secrets.providerClass }}
      {{- end }}
{{- end }}
