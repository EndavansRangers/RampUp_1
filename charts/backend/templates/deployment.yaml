{{- $colors := list "blue" "green" }}
{{- range $colors }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Chart.Name }}-{{ . }}
  namespace: tunefy-dev
  labels:
    app: {{ $.Chart.Name }}
    color: {{ . }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  replicas: {{ $.Values.replicaCount }}
  revisionHistoryLimit: 3  # Keep 3 ReplicaSets (more memory available with c7i-flex.large)
  strategy:
    type: RollingUpdate  # Back to RollingUpdate for zero-downtime deployments
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ $.Chart.Name }}
      color: {{ . }}
  template:
    metadata:
      labels:
        app: {{ $.Chart.Name }}
        color: {{ . }}
        {{- if eq . $.Values.color }}
        colorLive: "true"
        {{- else }}
        colorLive: "false"
        {{- end }}
    spec:
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
      - name: backend
        image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - containerPort: {{ $.Values.service.targetPort }}
          protocol: TCP
        env:
        {{- if $.Values.env }}
        {{- toYaml $.Values.env | nindent 8 }}
        {{- end }}
        {{- if $.Values.livenessProbe }}
        livenessProbe:
          {{- toYaml $.Values.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if $.Values.readinessProbe }}
        readinessProbe:
          {{- toYaml $.Values.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if $.Values.resources }}
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
        {{- end }}
{{- end }}
