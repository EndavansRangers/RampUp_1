color: "blue"  # Octopus alterna entre "blue" y "green"

image:
  repository: 365074502389.dkr.ecr.us-east-1.amazonaws.com/tunefy-backend-dev
  tag: "#{Octopus.Release.Number}"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-creds

replicaCount: 2

service:
  name: backend  # Servicio "estable"
  port: 3001
  targetPort: 3001
  type: ClusterIP
  selector:
    colorLive: "blue"  # Octopus cambia a "green" tras smoke test

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
  hosts:
    - host: api.dev.tunefy.local  # Cambiar por tu dominio
      paths:
        - path: /api
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3

env:
  - name: NODE_ENV
    value: "development"
  - name: PORT
    value: "3001"
  # Agregar otras variables de entorno necesarias
