color: "blue"  # Octopus alterna entre "blue" y "green"

image:
  repository: 365074502389.dkr.ecr.us-east-1.amazonaws.com/tunefy-backend-dev
  tag: "#{Octopus.Release.Number}"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-creds

replicaCount: 1

service:
  name: backend  # Servicio "estable"
  port: 3001
  targetPort: 3001
  type: ClusterIP
  selector:
    colorLive: "blue"  # Octopus cambia a "green" tras smoke test

ingress:
  enabled: false  # Backend solo accesible vía Service interno (frontend nginx hace proxy)

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3

env:
  - name: NODE_ENV
    value: "development"
  - name: PORT
    value: "3001"
  # DB credentials now come from Secrets Manager via CSI (see secrets section below)

secrets:
  enabled: true
  secretName: backend-db
  providerClass: spc-backend-db
