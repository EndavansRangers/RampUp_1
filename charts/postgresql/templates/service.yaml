apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: tunefy-dev
  labels:
    app: {{ .Chart.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
    name: postgresql
  selector:
    app: {{ .Chart.Name }}
