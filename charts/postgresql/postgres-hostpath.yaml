apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: tunefy-dev
type: Opaque
stringData:
  POSTGRES_DB: tunefy
  POSTGRES_USER: tunefy_user
  POSTGRES_PASSWORD: Ey7zF2qZdN6g10PW1pafHIxkR
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: tunefy-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
          name: postgres
        envFrom:
        - secretRef:
            name: postgres-credentials
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data/pgdata
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "tunefy_user"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "tunefy_user"]
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: postgres-storage
        hostPath:
          path: /var/lib/postgresql/data
          type: DirectoryOrCreate
      nodeSelector:
        kubernetes.io/arch: amd64  # Run on any node
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tunefy-dev
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: tunefy-db-rw
  namespace: tunefy-dev
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
