apiVersion: batch/v1
kind: Job
metadata:
  name: fix-frontend-dns
  namespace: tunefy-dev
  annotations:
    # Este Job se debe ejecutar después de cada deployment del frontend
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: frontend-dns-fixer
      restartPolicy: OnFailure
      containers:
      - name: fix-dns
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e
          
          echo "🔧 Fixing frontend DNS configuration..."
          
          # Wait for frontend pod to be ready
          kubectl wait --for=condition=ready pod -l app=tunefy-frontend -n tunefy-dev --timeout=120s
          
          # Get frontend pod name
          FRONTEND_POD=$(kubectl get pods -n tunefy-dev -l app=tunefy-frontend -o jsonpath='{.items[0].metadata.name}')
          echo "   Frontend pod: $FRONTEND_POD"
          
          # Get backend service IP
          BACKEND_IP=$(kubectl get svc backend -n tunefy-dev -o jsonpath='{.spec.clusterIP}')
          echo "   Backend IP: $BACKEND_IP:3001"
          
          # Patch nginx config to use backend IP instead of DNS
          kubectl exec -n tunefy-dev $FRONTEND_POD -- sh -c "
            sed -i 's|backend\.tunefy-dev\.svc\.cluster\.local|$BACKEND_IP:3001|g' /etc/nginx/conf.d/default.conf &&
            sed -i 's|tunefy-backend-service\.default\.svc\.cluster\.local|$BACKEND_IP:3001|g' /etc/nginx/conf.d/default.conf &&
            nginx -s reload
          "
          
          echo "✅ DNS fix applied successfully!"
          
          # Test the connection
          echo "🧪 Testing backend connection..."
          if kubectl exec -n tunefy-dev $FRONTEND_POD -- wget -O- -T 5 http://$BACKEND_IP:3001/health 2>&1 | grep -q "healthy"; then
            echo "✅ Backend is reachable!"
          else
            echo "⚠️  Backend test inconclusive, but config was updated"
          fi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-dns-fixer
  namespace: tunefy-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-dns-fixer
  namespace: tunefy-dev
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "services"]
  verbs: ["get", "list", "create"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-dns-fixer
  namespace: tunefy-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frontend-dns-fixer
subjects:
- kind: ServiceAccount
  name: frontend-dns-fixer
  namespace: tunefy-dev
