# Ingress para exponer la aplicación Tunefy
# Requiere AWS Load Balancer Controller instalado
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tunefy-ingress
  namespace: tunefy-app
  annotations:
    # AWS Load Balancer Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    # Tags
    alb.ingress.kubernetes.io/tags: Environment=Production,Project=Tunefy,ManagedBy=Terraform
spec:
  rules:
  - http:
      paths:
      # Backend API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: tunefy-backend
            port:
              number: 3001
      # Frontend routes (default)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tunefy-frontend
            port:
              number: 80
