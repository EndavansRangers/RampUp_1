apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: tunefy-app
data:
  # URL del backend para las llamadas API
  REACT_APP_BACKEND_URL: "http://tunefy-prod.example.com/api"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunefy-frontend
  namespace: tunefy-app
  labels:
    app: tunefy-frontend
    tier: frontend
    env: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tunefy-frontend
  template:
    metadata:
      labels:
        app: tunefy-frontend
        tier: frontend
        env: prod
    spec:
      containers:
      - name: frontend
        image: 038686090046.dkr.ecr.us-east-1.amazonaws.com/tunefy-frontend-prod:latest
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        env:
        - name: REACT_APP_BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: REACT_APP_BACKEND_URL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tunefy-frontend
  namespace: tunefy-app
  labels:
    app: tunefy-frontend
    tier: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: tunefy-frontend
