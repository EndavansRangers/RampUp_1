apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-db-external
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: backend-db-from-asm
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: tunefy/prod/database
