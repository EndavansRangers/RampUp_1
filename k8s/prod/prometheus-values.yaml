# kube-prometheus-stack values for production
# Install: helm install prometheus prometheus-community/kube-prometheus-stack -n monitoring -f prometheus-values.yaml

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Retention
    retention: 15d
    retentionSize: "50GB"
    
    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 60Gi
    
    # Resources
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 4Gi
    
    # Service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    
    # Additional scrape configs for CloudNativePG
    additionalScrapeConfigs:
      - job_name: 'cnpg-cluster'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - tunefy-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            action: keep
            regex: tunefy-db
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: ${1}:9187

# Alertmanager configuration
alertmanager:
  alertmanagerSpec:
    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    
    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  
  # Basic configuration (will be updated when Slack webhook is available)
  config:
    global:
      resolve_timeout: 5m
    
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - match:
            alertname: Watchdog
          receiver: 'null'
        # When you have Slack webhook, uncomment and configure:
        # - match:
        #     severity: critical
        #   receiver: 'slack-critical'
        # - match:
        #     severity: warning
        #   receiver: 'slack-alerts'
    
    receivers:
      - name: 'null'
      # Uncomment when Slack webhook is available:
      # - name: 'slack-alerts'
      #   slack_configs:
      #     - api_url: 'YOUR_SLACK_WEBHOOK_URL'
      #       channel: '#tunefy-alerts'
      #       title: 'Tunefy Production Alert'
      #       text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
      # - name: 'slack-critical'
      #   slack_configs:
      #     - api_url: 'YOUR_SLACK_WEBHOOK_URL'
      #       channel: '#tunefy-critical'
      #       title: 'CRITICAL: Tunefy Production'
      #       text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

# Grafana configuration
grafana:
  enabled: true
  
  # Admin credentials
  adminPassword: "TunefyGrafanaProd2025!"
  
  # Persistence
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi
  
  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  # Service type - ClusterIP (will use port-forward or ingress)
  service:
    type: ClusterIP
    port: 80
  
  # Datasources - Prometheus
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-kube-prometheus-prometheus.monitoring:9090
          access: proxy
          isDefault: true

# Node exporter - enabled for node metrics
nodeExporter:
  enabled: true

# Kube-state-metrics - enabled for Kubernetes metrics
kubeStateMetrics:
  enabled: true

# Disable components we don't need
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: false
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
