apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-api-key-external
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: google-api-key
    creationPolicy: Owner
  data:
  - secretKey: api-key
    remoteRef:
      key: tunefy/prod/google-api-key
