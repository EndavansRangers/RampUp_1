apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'cluster', 'service', 'namespace']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'slack-prod'
      routes:
        - match:
            severity: critical
          receiver: 'slack-critical'
          continue: true
        - match:
            severity: warning
          receiver: 'slack-prod'

    receivers:
      - name: 'slack-prod'
        slack_configs:
          - api_url: ${SLACK_ALERTS_WEBHOOK}
            channel: '#tunefy-prod-alerts'
            title: 'Tunefy Production Alert'
            text: |
              *Alert:* {{ .GroupLabels.alertname }}
              *Severity:* {{ .GroupLabels.severity }}
              *Namespace:* {{ .GroupLabels.namespace }}
              {{ range .Alerts }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ end }}
            send_resolved: true

      - name: 'slack-critical'
        slack_configs:
          - api_url: ${SLACK_CRITICAL_WEBHOOK}
            channel: '#tunefy-prod-critical'
            title: 'CRITICAL - Tunefy Production'
            text: |
              @channel
              *CRITICAL ALERT*
              *Alert:* {{ .GroupLabels.alertname }}
              *Namespace:* {{ .GroupLabels.namespace }}
              {{ range .Alerts }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ end }}
            send_resolved: true
