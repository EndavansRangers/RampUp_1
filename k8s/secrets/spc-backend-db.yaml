apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: spc-backend-db
  namespace: tunefy-dev
spec:
  provider: aws
  parameters:
    region: us-east-1
    objects: |
      - objectName: "tunefy/dev/backend/db"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db_user
          - path: password
            objectAlias: db_pass
          - path: host
            objectAlias: db_host
          - path: dbname
            objectAlias: db_name
          - path: port
            objectAlias: db_port
  secretObjects:
  - secretName: backend-db
    type: Opaque
    data:
    - objectName: db_user
      key: username
    - objectName: db_pass
      key: password
    - objectName: db_host
      key: host
    - objectName: db_name
      key: dbname
    - objectName: db_port
      key: port
