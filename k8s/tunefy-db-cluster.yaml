apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tunefy-db
  namespace: tunefy-dev
spec:
  # Solo 1 instancia para free tier (t2.micro tiene poca memoria)
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.1
  
  # Storage configuration
  storage:
    storageClass: gp3
    size: 5Gi  # Reducido de 10Gi para free tier
  
  # Bootstrap configuration
  bootstrap:
    initdb:
      database: tunefy
      owner: tunefy_user
      secret:
        name: tunefy-db-credentials
  
  # Resource limits ajustados para t2.micro (1GB RAM)
  resources:
    requests:
      memory: "256Mi"  # Reducido de 512Mi
      cpu: "250m"      # Reducido de 500m
    limits:
      memory: "512Mi"  # Reducido de 1Gi
      cpu: "500m"      # Reducido de 1000m
  
  # Monitoring
  monitoring:
    enablePodMonitor: true
  
  # PostgreSQL configuration optimizada para poca memoria
  postgresql:
    parameters:
      shared_buffers: "128MB"      # Reducido de 256MB
      max_connections: "50"        # Reducido de 100
      work_mem: "2MB"              # Reducido de 4MB
      maintenance_work_mem: "32MB"
      effective_cache_size: "256MB"
    pg_hba:
      - host all all all scram-sha-256
  
  # High Availability (deshabilitado para free tier con 1 instancia)
  primaryUpdateStrategy: unsupervised
