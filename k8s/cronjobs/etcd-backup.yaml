---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etcd-backup
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: etcd-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: etcd-backup
subjects:
  - kind: ServiceAccount
    name: etcd-backup
    namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: kube-system
  labels:
    app: etcd-backup
    component: disaster-recovery
spec:
  # Run daily at 2 AM UTC
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: etcd-backup
        spec:
          serviceAccountName: etcd-backup
          hostNetwork: true
          
          # Run on control plane nodes only
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          
          tolerations:
            - effect: NoSchedule
              key: node-role.kubernetes.io/control-plane
              operator: Exists
          
          containers:
            - name: backup
              image: amazon/aws-cli:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  
                  echo "========================================="
                  echo "🗄️  etcd Backup Job Started"
                  echo "========================================="
                  echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
                  echo "Node: $(hostname)"
                  
                  # Configuration
                  BACKUP_DATE=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/backup/etcd-snapshot-${BACKUP_DATE}.db"
                  S3_BUCKET="tunefy-etcd-backups-prod"
                  REGION="us-east-1"
                  
                  # Verify etcd certificates exist
                  echo "🔍 Verifying etcd certificates..."
                  if [ ! -f /etc/kubernetes/pki/etcd/ca.crt ]; then
                    echo "❌ ERROR: etcd CA certificate not found"
                    exit 1
                  fi
                  
                  # Install etcdctl if not present
                  if ! command -v etcdctl &> /dev/null; then
                    echo "📦 Installing etcdctl..."
                    ETCD_VERSION="v3.5.9"
                    wget -q https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/etcd-${ETCD_VERSION}-linux-amd64.tar.gz
                    tar xzf etcd-${ETCD_VERSION}-linux-amd64.tar.gz
                    mv etcd-${ETCD_VERSION}-linux-amd64/etcdctl /usr/local/bin/
                    rm -rf etcd-${ETCD_VERSION}-linux-amd64*
                    echo "✅ etcdctl installed"
                  fi
                  
                  # Create snapshot
                  echo "📦 Creating etcd snapshot..."
                  ETCDCTL_API=3 etcdctl snapshot save ${BACKUP_FILE} \
                    --endpoints=https://127.0.0.1:2379 \
                    --cacert=/etc/kubernetes/pki/etcd/ca.crt \
                    --cert=/etc/kubernetes/pki/etcd/server.crt \
                    --key=/etc/kubernetes/pki/etcd/server.key
                  
                  if [ $? -ne 0 ]; then
                    echo "❌ ERROR: Failed to create snapshot"
                    exit 1
                  fi
                  
                  echo "✅ Snapshot created: ${BACKUP_FILE}"
                  BACKUP_SIZE=$(du -h ${BACKUP_FILE} | cut -f1)
                  echo "📊 Snapshot size: ${BACKUP_SIZE}"
                  
                  # Verify snapshot integrity
                  echo "🔍 Verifying snapshot integrity..."
                  ETCDCTL_API=3 etcdctl snapshot status ${BACKUP_FILE} \
                    --write-out=table
                  
                  if [ $? -ne 0 ]; then
                    echo "❌ ERROR: Snapshot verification failed"
                    exit 1
                  fi
                  echo "✅ Snapshot verified"
                  
                  # Upload to S3
                  echo "☁️  Uploading to S3..."
                  aws s3 cp ${BACKUP_FILE} \
                    s3://${S3_BUCKET}/prod/${BACKUP_DATE}/etcd-snapshot.db \
                    --region ${REGION} \
                    --storage-class STANDARD_IA \
                    --server-side-encryption AES256
                  
                  if [ $? -ne 0 ]; then
                    echo "❌ ERROR: Failed to upload to S3"
                    exit 1
                  fi
                  echo "✅ Backup uploaded to: s3://${S3_BUCKET}/prod/${BACKUP_DATE}/"
                  
                  # Get cluster info and save as metadata
                  echo "📋 Saving cluster metadata..."
                  cat > /backup/metadata-${BACKUP_DATE}.json <<EOF
                  {
                    "backup_date": "${BACKUP_DATE}",
                    "backup_size": "${BACKUP_SIZE}",
                    "kubernetes_version": "$(kubectl version --short 2>/dev/null || echo 'unknown')",
                    "etcd_version": "$(etcdctl version | head -1 || echo 'unknown')",
                    "node": "$(hostname)",
                    "cluster_name": "tunefy-prod"
                  }
                  EOF
                  
                  aws s3 cp /backup/metadata-${BACKUP_DATE}.json \
                    s3://${S3_BUCKET}/prod/${BACKUP_DATE}/metadata.json \
                    --region ${REGION}
                  
                  # List recent backups
                  echo "📂 Recent backups in S3:"
                  aws s3 ls s3://${S3_BUCKET}/prod/ --region ${REGION} | tail -10
                  
                  # Cleanup old backups in S3 (keep last 7 days)
                  echo "🧹 Cleaning old backups (keeping last 7 days)..."
                  CUTOFF_DATE=$(date -d '7 days ago' +%Y%m%d 2>/dev/null || date -v-7d +%Y%m%d)
                  
                  aws s3 ls s3://${S3_BUCKET}/prod/ --region ${REGION} | \
                    awk '{print $2}' | \
                    while read folder; do
                      folder_date=$(echo $folder | cut -d'-' -f1)
                      if [ ! -z "$folder_date" ] && [ "$folder_date" -lt "$CUTOFF_DATE" ]; then
                        echo "Deleting old backup: $folder"
                        aws s3 rm s3://${S3_BUCKET}/prod/${folder} --recursive --region ${REGION}
                      fi
                    done
                  
                  # Cleanup local files
                  echo "🧹 Cleaning local files..."
                  rm -f ${BACKUP_FILE}
                  rm -f /backup/metadata-${BACKUP_DATE}.json
                  
                  echo "========================================="
                  echo "✅ etcd Backup Completed Successfully!"
                  echo "========================================="
                  echo "Backup location: s3://${S3_BUCKET}/prod/${BACKUP_DATE}/"
                  echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
              
              volumeMounts:
                - name: etcd-certs
                  mountPath: /etc/kubernetes/pki/etcd
                  readOnly: true
                - name: backup
                  mountPath: /backup
              
              env:
                - name: ETCDCTL_API
                  value: "3"
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
              
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          
          volumes:
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd
                type: Directory
            - name: backup
              emptyDir: {}
          
          restartPolicy: OnFailure
