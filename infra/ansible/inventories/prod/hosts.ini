# Tunefy Production Kubernetes Cluster Inventory
# 
# Update the IP addresses after running Terraform apply
# Get IPs with:
# aws ec2 describe-instances \
#   --filters "Name=tag:Name,Values=tunefy-prod-cp" \
#             "Name=instance-state-name,Values=running" \
#   --query 'Reservations[*].Instances[*].[PrivateIpAddress,InstanceId]' \
#   --output table

[bastion]
bastion ansible_host=BASTION_PUBLIC_IP ansible_user=ubuntu

[cp]
cp1 ansible_host=10.20.X.X ansible_user=ubuntu
cp2 ansible_host=10.20.X.X ansible_user=ubuntu
cp3 ansible_host=10.20.X.X ansible_user=ubuntu

[workers]
wk1 ansible_host=10.20.X.X ansible_user=ubuntu
wk2 ansible_host=10.20.X.X ansible_user=ubuntu
wk3 ansible_host=10.20.X.X ansible_user=ubuntu

[k8s:children]
cp
workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -q ubuntu@BASTION_PUBLIC_IP" -o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3
