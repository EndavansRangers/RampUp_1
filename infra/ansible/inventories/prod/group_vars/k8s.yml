---
# Kubernetes-specific variables for Production

# kubeadm config for HA
kubeadm_config_api_version: kubeadm.k8s.io/v1beta3

# Control plane configuration
control_plane:
  replicas: 3
  load_balancer_port: 6443

# etcd configuration
etcd:
  data_dir: /var/lib/etcd
  snapshot_count: 10000
  quota_backend_bytes: 8589934592  # 8GB

# Kubelet configuration
kubelet:
  max_pods: 110
  pod_pids_limit: 4096
  system_reserved:
    cpu: "100m"
    memory: "256Mi"
  kube_reserved:
    cpu: "100m"
    memory: "256Mi"

# CNI - Calico
cni: calico
calico_version: "v3.27.0"
calico_encapsulation: "VXLAN"

# Enable audit logging
enable_audit_log: true
