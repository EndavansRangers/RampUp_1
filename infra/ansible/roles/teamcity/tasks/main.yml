- name: Docker repo key
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    timeout 30 curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Docker repo
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

- name: Docker engine (para CI)
  apt:
    update_cache: yes
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  register: docker_pkgs
  failed_when: false  # si ya está containerd, ignora fallos leves

- name: Crear dirs
  file: { path: "{{ item }}", state: directory, mode: "0755" }
  loop:
    - "{{ teamcity_dir }}/data"
    - "{{ teamcity_dir }}/logs"

- name: Compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ teamcity_dir }}/docker-compose.yml"

- name: Agent Dockerfile
  template:
    src: Dockerfile.agent.j2
    dest: "{{ teamcity_dir }}/Dockerfile.agent"

- name: Rebuild agent con AWS CLI
  command: docker compose build agent
  args: { chdir: "{{ teamcity_dir }}" }

- name: Levantar TeamCity
  command: docker compose up -d
  args: { chdir: "{{ teamcity_dir }}" }
