- name: Docker repo key
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg

- name: Docker repo
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

- name: Docker engine (para Octopus)
  apt:
    update_cache: yes
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  register: docker_pkgs
  failed_when: false

- name: Crear dirs
  file: { path: "{{ item }}", state: directory, mode: "0755" }
  loop:
    - "{{ octopus_dir }}/mssql"
    - "{{ octopus_dir }}/octopus"

- name: Compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ octopus_dir }}/docker-compose.yml"

- name: Levantar Octopus
  command: docker compose up -d
  args: { chdir: "{{ octopus_dir }}" }
