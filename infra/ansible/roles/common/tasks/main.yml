- name: APT base
  apt:
    update_cache: yes
    cache_valid_time: 600
    name:
      - ca-certificates
      - curl
      - gnupg
      - apt-transport-https
      - software-properties-common
      - lsb-release
      - jq
      - net-tools

# Si no tienes la colección community.general, usa timedatectl:
- name: Set timezone
  command: timedatectl set-timezone "{{ timezone }}"
  when: timezone is defined
  changed_when: false

- name: Disable swap (runtime)
  command: swapoff -a
  when: ansible_swaptotal_mb | default(0) | int > 0
  changed_when: false

- name: Disable swap in fstab
  replace:
    path: /etc/fstab
    regexp: '^\s*([^#]+)\s+swap\s+'
    replace: '# \1 swap '
  notify: [ "reboot maybe" ]

- name: Load modules
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Modprobe now
  shell: |
    modprobe overlay
    modprobe br_netfilter

- name: Sysctl for K8s
  when: sysctl_settings is defined and sysctl_settings | length > 0
  copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      {% for s in sysctl_settings %}
      {{ s.name }} = {{ s.value }}
      {% endfor %}
  notify: [ "sysctl reload" ]

- name: Ensure packages for docker/compose
  apt:
    name: [ "gnupg-agent" ]
    state: present

# check if the docker group exists 
- name: Check if docker group exists
  command: getent group docker
  register: docker_group_check
  failed_when: false
  changed_when: false

# add to the docker group if exists 
- name: Add ubuntu to docker group if exists
  user:
    name: ubuntu
    groups: docker
    append: yes
  when: docker_group_check.rc == 0