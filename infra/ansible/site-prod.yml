---
# Tunefy Production Kubernetes Cluster Setup
# 
# Usage:
#   ansible-playbook -i inventories/prod/hosts.ini site-prod.yml
#
# Steps:
#   1. Common setup (all nodes)
#   2. Containerd installation (all nodes)
#   3. Kubernetes packages (all nodes)
#   4. Control plane HA setup (3 CPs)
#   5. Worker nodes join
#   6. Calico CNI installation
#   7. etcd backup cronjob deployment

- name: Common setup for all nodes
  hosts: k8s
  become: yes
  roles:
    - common

- name: Install and configure containerd
  hosts: k8s
  become: yes
  roles:
    - containerd

- name: Install Kubernetes packages
  hosts: k8s
  become: yes
  roles:
    - kubernetes

- name: Initialize primary control plane
  hosts: cp[0]
  become: yes
  tasks:
    - name: Include control-plane role for primary CP
      include_role:
        name: control-plane
        tasks_from: main-ha.yml

- name: Join secondary control planes
  hosts: cp[1:]
  become: yes
  serial: 1  # Join one at a time
  tasks:
    - name: Include control-plane role for secondary CPs
      include_role:
        name: control-plane
        tasks_from: main-ha.yml

- name: Verify control plane cluster
  hosts: cp[0]
  tasks:
    - name: Get control plane nodes
      command: kubectl get nodes -l node-role.kubernetes.io/control-plane
      register: cp_nodes

    - name: Show control plane nodes
      debug:
        msg: "{{ cp_nodes.stdout_lines }}"

    - name: Verify etcd cluster members
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl -n kube-system exec -it etcd-{{ inventory_hostname }} -- \
          etcdctl --endpoints=https://127.0.0.1:2379 \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          member list
      register: etcd_members
      ignore_errors: yes

    - name: Show etcd cluster members
      debug:
        msg: "{{ etcd_members.stdout_lines }}"
      when: etcd_members is defined and etcd_members.rc == 0

- name: Label worker nodes for workload distribution
  hosts: cp[0]
  tasks:
    - name: Label wk1 for monitoring workloads
      command: kubectl label node {{ hostvars['wk1'].inventory_hostname }} workload=monitoring --overwrite
      ignore_errors: yes

    - name: Label wk2 for frontend workloads
      command: kubectl label node {{ hostvars['wk2'].inventory_hostname }} workload=app-frontend --overwrite
      ignore_errors: yes

    - name: Label wk3 for backend workloads
      command: kubectl label node {{ hostvars['wk3'].inventory_hostname }} workload=app-backend --overwrite
      ignore_errors: yes

- name: Join worker nodes
  hosts: workers
  become: yes
  serial: 1  # Join one at a time
  roles:
    - worker

- name: Install Calico CNI
  hosts: cp[0]
  tasks:
    - name: Download Calico manifest
      get_url:
        url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"
        dest: /tmp/calico.yaml

    - name: Apply Calico manifest
      command: kubectl apply -f /tmp/calico.yaml

    - name: Wait for Calico pods to be ready
      shell: |
        kubectl -n kube-system get pods -l k8s-app=calico-node -o json | \
        jq -r '.items[] | select(.status.phase=="Running") | .metadata.name' | wc -l
      register: calico_pods
      until: calico_pods.stdout | int >= 3
      retries: 30
      delay: 10

- name: Deploy etcd backup CronJob
  hosts: cp[0]
  tasks:
    - name: Copy etcd backup CronJob manifest
      copy:
        src: ../../../k8s/cronjobs/etcd-backup.yaml
        dest: /tmp/etcd-backup.yaml

    - name: Apply etcd backup CronJob
      command: kubectl apply -f /tmp/etcd-backup.yaml

    - name: Verify CronJob created
      command: kubectl -n kube-system get cronjob etcd-backup
      register: cronjob_status

    - name: Show CronJob status
      debug:
        msg: "{{ cronjob_status.stdout_lines }}"

- name: Final verification
  hosts: cp[0]
  tasks:
    - name: Get all nodes
      command: kubectl get nodes -o wide
      register: all_nodes

    - name: Show all nodes
      debug:
        msg: "{{ all_nodes.stdout_lines }}"

    - name: Get all namespaces
      command: kubectl get namespaces
      register: namespaces

    - name: Show namespaces
      debug:
        msg: "{{ namespaces.stdout_lines }}"

    - name: Get system pods
      command: kubectl get pods -n kube-system -o wide
      register: system_pods

    - name: Show system pods
      debug:
        msg: "{{ system_pods.stdout_lines }}"

- name: Display next steps
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Show next steps
      debug:
        msg:
          - "=========================================="
          - "✅ Production Kubernetes Cluster Ready!"
          - "=========================================="
          - ""
          - "📋 Next Steps:"
          - "  1. Copy kubeconfig from control plane:"
          - "     scp -o ProxyCommand='ssh -W %h:%p ubuntu@{{ hostvars['bastion'].ansible_host }}' \\"
          - "         ubuntu@{{ hostvars['cp1'].ansible_host }}:/etc/kubernetes/admin.conf \\"
          - "         ~/.kube/config-prod"
          - ""
          - "  2. Update kubeconfig server URL:"
          - "     sed -i 's|https://127.0.0.1:6443|https://{{ control_plane_endpoint }}:6443|g' ~/.kube/config-prod"
          - ""
          - "  3. Test cluster access:"
          - "     export KUBECONFIG=~/.kube/config-prod"
          - "     kubectl get nodes"
          - ""
          - "  4. Install AWS Load Balancer Controller"
          - "  5. Apply ACM certificate for *.prod.tunefy.site"
          - "  6. Deploy application with Octopus"
          - ""
          - "📊 Cluster Info:"
          - "  - Control Planes: 3 nodes (HA)"
          - "  - Workers: 3 nodes (with workload labels)"
          - "  - CNI: Calico {{ calico_version }}"
          - "  - etcd: Clustered (3 replicas)"
          - "  - Backup: Automated (daily at 2 AM UTC)"
